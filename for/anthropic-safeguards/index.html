<script>
(function () {
  var html =
  '<section class="sec next fit" id="fit"><div class="sec-head"><h2>The posting, line by line</h2></div>' +
  '<p class="lead">Each heading is a line from the role description. Under it is what I have done that matches, with the evidence linked, or a plain note that I haven\'t.</p>' +

  '<p class="ask">Run evaluations for launch readiness and flag regressions or unexpected model behavior</p>' +
  '<p>The <a href="#isnad">citation study</a> scored 5,880 responses across five models from two labs on one measure: how often a model attaches real document text to an answer it actually got from memory. ' +
  'The <a href="#isnad-hops">handoff-notes pilot</a> found a regression nobody was looking for: Haiku\'s plain notes dropped the "the user told me" label on about half of user-sourced facts, while the other models kept it. ' +
  'In the <a href="#wobblins-study">artificial-life study</a>, the unexpected behavior was the agent\'s own write-up, which had rewritten its headline after the real prediction failed. I retracted it.</p>' +

  '<p class="ask">Work with policy and domain experts across the eval lifecycle, from scoping risks to keeping evals current</p>' +
  '<p>Every study here went through a separate AI reviewer before and after the run, and its findings are kept as errata and decision logs rather than folded away. ' +
  'When the first citation design confounded the instruction with the citation format, I ran a <a href="https://github.com/natepogue83/isnad/blob/main/isnad-experiment/MATCHED.md" target="_blank" rel="noopener">matched follow-up</a> that held the instruction constant, and it changed the conclusion for one of the two models.</p>' +

  '<p class="ask">Help manage evaluation outcomes and drive mitigations</p>' +
  '<p>The citation study didn\'t stop at the measurement. It tested a source-label prompt package as the mitigation, with no extra API calls, and it cut false citations to zero for four of the five models, though for two of them it mostly moved a disclosure they were already writing elsewhere in the answer. ' +
  'The handoff-notes regression was fixed by one added sentence in the prompt, measured before and after.</p>' +

  '<p class="ask">Improve eval quality so evaluations stay high-signal as models improve</p>' +
  '<p>Two examples of saying what an eval can\'t show. The citation study\'s quote check catches 100% of false citations, and the write-up says that number is built into how the items were made, not evidence. ' +
  'The artificial-life study\'s pre-registration went through three rounds of review, with the predictions tagged in git before the confirmatory run on 256 fresh seeds, so the result can\'t be read back into the hypothesis.</p>' +

  '<p class="ask">Build frameworks for product-specific evals, and design tooling that lets non-technical users create and iterate on evals</p>' +
  '<p>I am the non-technical user. I don\'t write code; every grader, harness and dashboard on this page was built by Claude Code and Codex under my direction, and I spent the past month learning exactly where that workflow breaks: ' +
  'where the agent grades its own work too kindly, where a label error hides in a scorer, where a run needs to be stopped unread. That is the experience I\'d bring to tooling for people who write evals without writing code.</p>' +

  '<p class="ask">Write and maintain documentation for eval creation, execution, and interpretation</p>' +
  '<p>Each study has a results file, a findings write-up for readers, a <a href="https://github.com/natepogue83/WobblesExperiment/blob/main/lab/research/SUMMARY.md" target="_blank" rel="noopener">one-page plain-language summary</a>, and a decision log, including a section on what I got wrong; the pre-registered ones have their predictions tagged in git. ' +
  'The reproduction steps for the artificial-life study were tested from a fresh clone.</p>' +

  '<p class="ask">Trust and safety, content operations, policy enforcement, or similar operational experience</p>' +
  '<p>Not at a tech company. My operational experience is a store manager role at QuikTrip (2022 to 2024), communications director at a nonprofit (2021 to 2022), and shipping two games at a small studio (2018 to 2021). ' +
  'The past two years were contract AI training data work for Handshake and Appen. <span class="gap">I have not held a trust-and-safety title.</span></p>' +

  '<p class="ask">Ambiguous, fast-moving settings; build processes from scratch; strong program management habits</p>' +
  '<p>The research process on this page didn\'t exist a month ago. Pre-registration, an independent reviewer, errata, a budget per run, a public record: I set each of those up because something went wrong without it. ' +
  'The studies ran in parallel on under fifty dollars of API credit, with the cost measured before every larger run.</p>' +

  '<p class="ask">Eager to adopt AI-assisted tools such as Claude Code</p>' +
  '<p>All of this was done in Claude Code, daily, with a second agent as reviewer. It is the only way I work.</p>' +

  '<p class="ask">Communicate clearly in writing and make judgment calls with incomplete information</p>' +
  '<p>The write-ups linked here are the evidence for the first part. For the second: a confirmatory run had started before the reviewer\'s audit was finished, so I stopped it and never read its output, and the next decision couldn\'t be shaped by a result I\'d already seen.</p>' +

  '<p class="ask">Strong candidates may also have: SOPs and runbooks, data tools, sensitive content</p>' +
  '<p>The reviewer prompts and reproduction steps in each repo are runbooks in all but name. ' +
  '<span class="gap">I use spreadsheets; I don\'t know SQL or Python. The timed coding test would show that, so I\'d rather say it here.</span></p>' +

  '<div class="note"><p>The main version of this portfolio, with the same work and no mapping, is at <a href="../../">natepogue83.github.io</a>.</p></div>' +
  '</section>';
  var main = document.getElementById("main");
  main.insertAdjacentHTML("afterbegin", html);
  var l = '<a href="#fit">The posting</a>';
  document.querySelectorAll(".nav").forEach(function (n) { n.insertAdjacentHTML("afterbegin", l); });
})();
</script>
